AWSTemplateFormatVersion: '2010-09-09'

Resources:

  StaticWebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: pipeline_CFT-static-site-2026
      WebsiteConfiguration:
        IndexDocument: index.html

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticWebsiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${StaticWebsiteBucket}/*